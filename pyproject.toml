[project]
name = "overlap-calculator"
version = "1.1.0"
description = "Batch spectral-overlap analysis between TD-DFT / experimental absorption and reference light sources (AM1.5G, CIE LED/FL)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Pınar Seyitdanlıoğlu" }]
keywords = [
  "gaussian",
  "td-dft",
  "spectral-overlap",
  "computational-chemistry",
  "photovoltaics",
  "beer-lambert",
  "am15g",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
  "pydantic==2.8.2",
  "pydantic-settings==2.4.0",
  "numpy==2.1.1",
  "pandas==2.2.2",
  "openpyxl==3.1.5",
  "matplotlib==3.9.2",
  "flask==3.0.3",
  "click==8.1.7",
  "typer==0.12.3",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.2",
  "mypy==1.11.2",
  "ruff==0.6.4",
]

[project.urls]
Homepage = "https://github.com/pinarsyt/overlap-calculator"
Repository = "https://github.com/pinarsyt/overlap-calculator"
Documentation = "https://github.com/pinarsyt/overlap-calculator/blob/main/docs/MANUAL.md"
Issues = "https://github.com/pinarsyt/overlap-calculator/issues"

[project.scripts]
overlap-calculator = "overlap_calculator.cli.main:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
overlap_calculator = ["data/*.csv"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N", "B"]
ignore = ["N999"]

[tool.ruff.lint.per-file-ignores]
"src/overlap_calculator/cli/main.py" = ["UP007"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = [
  "pydantic.*",
  "pydantic_settings.*",
  "flask.*",
  "matplotlib.*",
  "pandas.*",
  "typer.*",
  "werkzeug.*",
  "openpyxl.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["overlap_calculator.cli.*", "overlap_calculator.api.*"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["overlap_calculator.models", "overlap_calculator.config.settings"]
disable_error_code = ["misc"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q"
testpaths = ["tests"]
